<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Угадай слово</title>
  <style>
    :root {
      --orange: #FF7F11;
      --purple: #7B5E7B;
      --white: #F9F5F6;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--purple);
      color: var(--white);
      text-align: center;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    h1 {
      color: var(--orange);
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .game-container {
      background-color: var(--white);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }
    
    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--white);
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .correct {
      background: var(--orange);
      color: var(--white);
      border-color: var(--orange);
    }
    
    .present {
      background: var(--purple);
      color: var(--white);
      border-color: var(--purple);
    }
    
    .absent {
      background: #D3D3D3;
      color: white;
      border-color: #D3D3D3;
    }
    
    .input-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }
    
    #guess-input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      font-size: 1.2rem;
      border: 2px solid var(--purple);
      border-radius: 8px;
      text-align: center;
      text-transform: lowercase;
      box-sizing: border-box;
    }
    
    .help-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--purple);
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    
    .help-btn:hover {
      background-color: rgba(123, 94, 123, 0.1);
    }
    
    button {
      background-color: var(--orange);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
      width: 100%;
    }
    
    button:hover {
      background-color: #FF6B00;
    }
    
    #message {
      margin: 15px 0;
      font-size: 1.1rem;
      min-height: 1.5em;
      color: var(--purple);
      font-weight: bold;
    }

    /* Модальное окно подсказки */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background-color: var(--white);
      padding: 25px;
      border-radius: 15px;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--purple);
    }

    /* Адаптация для мобильных */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }
      
      .game-container {
        padding: 20px;
      }
      
      h1 {
        font-size: 2rem;
        margin-bottom: 20px;
      }
      
      .cell {
        font-size: 1.5rem;
      }
      
      #guess-input {
        padding: 10px 36px 10px 10px;
        font-size: 1rem;
      }
      
      button {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Угадай слово</h1>
  <div class="game-container">
    <div id="grid" class="grid"></div>
    <div id="message"></div>
    <div class="input-container">
      <input 
        type="text" 
        id="guess-input" 
        maxlength="6" 
        placeholder="Только русские буквы"
        oninput="this.value = this.value.replace(/[^А-Яа-яЁё]/g, '')"
        pattern="[А-Яа-яЁё]{6}"
        title="Вводите только 6 русских букв"
      >
      <button class="help-btn" onclick="showHelp()">?</button>
    </div>
    <button onclick="submitGuess()">Проверить</button>
  </div>

  <!-- Модальное окно подсказки -->
  <div id="helpModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="hideHelp()">&times;</span>
      <h2 style="color: var(--purple); margin-top: 0;">Как играть?</h2>
      <p style="color: var(--purple);">
        <span style="display: inline-block; width: 20px; height: 20px; background-color: var(--orange); border-radius: 3px; margin-right: 8px;"></span>
        <strong>Оранжевая</strong> - буква на своём месте<br><br>
        <span style="display: inline-block; width: 20px; height: 20px; background-color: var(--purple); border-radius: 3px; margin-right: 8px;"></span>
        <strong>Фиолетовая</strong> - буква есть в слове, но в другой позиции<br><br>
        <span style="display: inline-block; width: 20px; height: 20px; background-color: #D3D3D3; border-radius: 3px; margin-right: 8px;"></span>
        <strong>Серая</strong> - буквы нет в слове
      </p>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    // Функции для модального окна
    function showHelp() {
      document.getElementById('helpModal').style.display = 'flex';
    }
    
    function hideHelp() {
      document.getElementById('helpModal').style.display = 'none';
    }
    
    // Закрытие по клику вне окна
    window.onclick = function(event) {
      const modal = document.getElementById('helpModal');
      if (event.target === modal) {
        hideHelp();
      }
    }
  </script>
</body>
</html>
