<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Угадай слово</title>
  <style>
    :root {
      --orange: #FF7F11;
      --purple: #7B5E7B;
      --white: #F9F5F6;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--purple);
      color: var(--white);
      text-align: center;
      padding: 20px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }
    
    h1 {
      color: var(--orange);
      margin-bottom: 20px;
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .game-container {
      background-color: var(--white);
      padding: 15px 40px 15px 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: calc(100% - 60px);
      max-width: 380px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 15px;
      width: 100%;
    }
    
    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--white);
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    
    .correct {
      background: var(--orange);
      color: var(--white);
      border-color: var(--orange);
    }
    
    .present {
      background: var(--purple);
      color: var(--white);
      border-color: var(--purple);
    }
    
    .absent {
      background: #D3D3D3;
      color: white;
      border-color: #D3D3D3;
    }
    
    .input-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
      padding-right: 20px;
    }
    
    #guess-input {
      width: 100%;
      padding: 10px 35px 10px 10px;
      font-size: 1.1rem;
      border: 2px solid var(--purple);
      border-radius: 5px;
      text-align: center;
      text-transform: lowercase;
      box-sizing: border-box;
    }
    
    .help-btn {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--purple);
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.3s;
    }
    
    .help-btn:hover {
      background-color: rgba(123, 94, 123, 0.2);
    }
    
    .submit-btn {
      background-color: var(--orange);
      color: white;
      border: none;
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
      width: 100%;
    }
    
    .submit-btn:hover {
      background-color: #FF6B00;
    }
    
    #message {
      margin: 10px 0;
      font-size: 1rem;
      min-height: 1.5em;
      color: var(--purple);
      font-weight: bold;
    }

    /* Модальное окно подсказки */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background-color: var(--white);
      padding: 20px;
      border-radius: 10px;
      width: calc(100% - 40px);
      max-width: 350px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
    }
    
    .close-modal {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--purple);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.3s;
    }
    
    .close-modal:hover {
      background-color: rgba(123, 94, 123, 0.1);
    }

    .help-text {
      color: var(--purple);
      margin-bottom: 15px;
      text-align: left;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .color-hint {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .color-box {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      margin-right: 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Остальное содержимое без изменений -->
</body>
</html>
