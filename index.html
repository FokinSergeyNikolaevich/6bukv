<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6 Букв: Продукты</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      padding: 20px;
    }
    .game-container {
      max-width: 350px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }
    .cell {
      width: 50px;
      height: 50px;
      border: 2px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      background: white;
    }
    .correct {
      background: #6aaa64; /* Зеленый */
      color: white;
    }
    .present {
      background: #c9b458; /* Желтый */
      color: white;
    }
    .absent {
      background: #787c7e; /* Серый */
      color: white;
    }
    #message {
      margin: 20px 0;
      font-weight: bold;
    }
  </style>
  /* Добавить в секцию style */
#guess-input:invalid {
  border-color: #ff4444;
  animation: shake 0.5s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-5px); }
  40%, 80% { transform: translateX(5px); }
}
</head>
<body>
  <h1>6 Букв</h1>
  <div class="game-container">
    <div id="grid" class="grid"></div>
    <div id="message"></div>
   <input 
  type="text" 
  id="guess-input" 
  maxlength="6" 
  placeholder="Только русские буквы"
  pattern="[А-Яа-яЁё]+" 
  title="Вводите только русские буквы"
>
    <button onclick="submitGuess()">Проверить</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
