<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Угадай слово</title>
  <style>
    :root {
      --orange: #FF7F11;
      --purple: #7B5E7B;
      --white: #F9F5F6;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--purple);
      color: var(--white);
      text-align: center;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    h1 {
      color: var(--orange);
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .game-container {
      background-color: var(--white);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 100%;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }
    
    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--white);
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .correct {
      background: var(--orange);
      color: var(--white);
      border-color: var(--orange);
    }
    
    .present {
      background: var(--purple);
      color: var(--white);
      border-color: var(--purple);
    }
    
    .absent {
      background: #D3D3D3;
      color: white;
      border-color: #D3D3D3;
    }
    
    #guess-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      border: 2px solid var(--purple);
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      text-transform: lowercase;
    }
    
    button {
      background-color: var(--orange);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
    }
    
    button:hover {
      background-color: #FF6B00;
    }
    
    #message {
      margin: 15px 0;
      font-size: 1.1rem;
      min-height: 1.5em;
      color: var(--purple);
      font-weight: bold;
    }

    /* Адаптация для мобильных */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }
      
      .game-container {
        padding: 20px;
      }
      
      h1 {
        font-size: 2rem;
        margin-bottom: 20px;
      }
      
      .cell {
        font-size: 1.5rem;
      }
      
      #guess-input {
        padding: 10px;
        font-size: 1rem;
      }
      
      button {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Угадай слово</h1>
  <div class="game-container">
    <div id="grid" class="grid"></div>
    <div id="message"></div>
    <input 
      type="text" 
      id="guess-input" 
      maxlength="6" 
      placeholder="Только русские буквы"
      oninput="this.value = this.value.replace(/[^А-Яа-яЁё]/g, '')"
      pattern="[А-Яа-яЁё]{6}"
      title="Вводите только 6 русских букв"
    >
    <button onclick="submitGuess()">Проверить</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
